*{box-sizing:border-box}

.sub{margin:0 0 18px;color:#9fb4d3;font-size:14px}

label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#9fb4d3;text-transform:uppercase;letter-spacing:.05em}

button:hover{background:#1f4380}
button.primary{background:#1e8f4e;border-color:#2fb86a;font-weight:700}
button.primary:hover{background:#25ab5d}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hint{color:#7d93b5;font-size:12px;margin:14px 0 0}

.cap{width:44px;height:44px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-weight:800;position:relative;overflow:hidden}
.pv{text-align:center;font-size:12px;color:#9fb4d3}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 8px;border-bottom:1px solid #1d3558;vertical-align:top}td:first-child{white-space:nowrap;font-weight:700;color:#ffd166;width:34%}

.stat{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;text-align:center;padding:5px 0;border-bottom:1px solid #1d3558}

<script>
// Hilfsfunktionen: Mathe, Zufall, Geometrie
(function () {
  const WP = (globalThis.WP = globalThis.WP || {});

  // Seed-fähiger Zufallsgenerator (mulberry32)
  function makeRng(seed) {
    let a = seed >>> 0;
    const f = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return f;
  }

  const U = {
    makeRng,
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    dist: (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
    dist2: (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2),
    angle: (from, to) => Math.atan2(to.y - from.y, to.x - from.x),
    angDiff(a, b) {
      let d = a - b;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return d;
    },
    // Abstand Punkt p zur Strecke a-b
    distToSegment(px, py, ax, ay, bx, by) {
      const dx = bx - ax, dy = by - ay;
      const l2 = dx * dx + dy * dy;
      let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
    },
    pick: (rng, arr) => arr[Math.floor(rng() * arr.length) % arr.length],
    fmtClock(sec) {
      sec = Math.max(0, Math.ceil(sec));
      const m = Math.floor(sec / 60), s = sec % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    },
  };
  WP.U = U;
})();

</script>

<script>
// Synthetische Sounds (WebAudio) – keine Dateien nötig
(function () {
  const WP = (globalThis.WP = globalThis.WP || {});
  let ctx = null, master = null, crowdGain = null, enabled = true;

  function init() {
    if (ctx || typeof AudioContext === 'undefined') return;
    try {
      ctx = new AudioContext();
      master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
      // Publikum: gefiltertes Rauschen
      const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 0.5;
      crowdGain = ctx.createGain(); crowdGain.gain.value = 0.05;
      src.connect(f); f.connect(crowdGain); crowdGain.connect(master); src.start();
    } catch (e) { ctx = null; }
  }
  function noise(dur, freq, vol, type) {
    if (!ctx || !enabled) return;
    const len = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  function tone(freq, dur, vol, type, vib) {
    if (!ctx || !enabled) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    if (vib) {
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = vib; lg.gain.value = freq * 0.03; l.connect(lg); lg.connect(o.frequency); l.start(); l.stop(ctx.currentTime + dur);
    }
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime + dur);
  }

  WP.Audio = {
    init, resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); },
    setEnabled(v) { enabled = v; if (master) master.gain.value = v ? 0.5 : 0; },
    isEnabled: () => enabled,
    whistle(n) {
      n = n || 1;
      for (let i = 0; i < n; i++) setTimeout(() => tone(2750, 0.32, 0.25, 'sine', 38), i * 380);
    },
    splash(v) { noise(0.25, 1800, Math.min(0.35, 0.05 + (v || 1) * 0.04)); },
    ball(v) { tone(180, 0.09, Math.min(0.4, 0.1 + (v || 1) * 0.02), 'triangle'); noise(0.06, 900, 0.12); },
    post() { tone(620, 0.35, 0.3, 'square'); tone(930, 0.25, 0.12, 'sine'); },
    save() { noise(0.12, 600, 0.3); tone(140, 0.12, 0.25, 'triangle'); },
    horn() { tone(220, 1.1, 0.35, 'sawtooth'); tone(330, 1.1, 0.2, 'sawtooth'); },
    goal() {
      if (crowdGain) { crowdGain.gain.setTargetAtTime(0.22, ctx.currentTime, 0.05); crowdGain.gain.setTargetAtTime(0.05, ctx.currentTime + 2.2, 0.6); }
      tone(440, 0.5, 0.2, 'square'); setTimeout(() => tone(660, 0.6, 0.2, 'square'), 180);
    },
    cheer(a) { if (crowdGain) { crowdGain.gain.setTargetAtTime(0.05 + (a || 0.08), ctx.currentTime, 0.1); crowdGain.gain.setTargetAtTime(0.05, ctx.currentTime + 1, 0.5); } },
  };
})();

</script>

(function () {

    constructor(o) {

      this.rng = U.makeRng(o.seed || (Date.now() & 0xffffff));
      this.diff = WP.DIFFICULTY[o.diff || 'normal'];
      this.rate = C.QUARTER_S / (o.quarterReal || 180);
      const A = WP.TEAMS[o.home], B = WP.TEAMS[o.away];
      const capA = WP.CAPS.find(c => c.id === (o.cap || 'white')) || WP.CAPS[0];
      let capB = WP.CAPS.find(c => c.id === 'blue');
      if (capA.id === 'blue' || capA.id === 'navy') capB = WP.CAPS[0];
      this.teams = [this.mkTeam(0, A, capA, o.style || 'classic'), this.mkTeam(1, B, capB, B.style)];
      this.teams[0].dir = 1; this.teams[1].dir = -1;
      this.players = this.teams[0].players.concat(this.teams[1].players);
      this.ball = { x: 15, y: 10, z: 0, vx: 0, vy: 0, vz: 0, owner: null, flight: null, target: null, lastTeam: -1, lastPlayer: null, noPick: 0, shotTeam: -1, shotT: 99, tried: {} };
      this.input = { mx: 0, my: 0, sprint: false, aimX: 15, aimY: 10, shootHeld: false, shootRelease: false, pass: false, tackle: false, fake: false, switchP: false, sub: false, timeout: false, dive: 0 };
      this.charge = 0;
      this.quarter = 0; this.clock = C.QUARTER_S; this.shotClock = C.SHOT_CLOCK; this.poss = -1;

        c.fillStyle = 'rgba(8,16,32,0.88)'; this.rr(c, w / 2 - 28, 56, 56, 24, 8); c.fill();
        c.fillStyle = sc <= 5 ? '#ff5d5d' : '#ffd166'; c.font = '800 16px system-ui'; c.fillText(sc, w / 2, 69);
        c.fillStyle = g.teams[g.poss].cap.hex; c.beginPath(); c.arc(w / 2 - 20, 68, 4, 0, 6.3); c.fill();
      }
      // Hinausstellungen
      for (let t = 0; t < 2; t++) {
        const list = g.teams[t].players.filter(p => !p.inPool && p.excl > 0);
        list.forEach((p, i) => {
          const x = t === 0 ? 14 : w - 14; c.textAlign = t === 0 ? 'left' : 'right';
          c.fillStyle = 'rgba(8,16,32,0.85)'; const bw = 118; this.rr(c, t === 0 ? x : x - bw, 60 + i * 24, bw, 20, 6); c.fill();
          c.fillStyle = '#ff8a8a'; c.font = '600 12px system-ui'; c.fillText((p.perm ? '✖ ' : '⏱ ') + '#' + p.num + ' ' + (p.excl > 99 ? 'Sperre' : Math.ceil(p.excl) + ' s'), t === 0 ? x + 8 : x - 8, 70 + i * 24);
        });
        c.textAlign = t === 0 ? 'left' : 'right'; c.fillStyle = '#9fb4d3'; c.font = '11px system-ui';
        c.fillText('Auszeiten: ' + g.teams[t].timeouts + '  Fouls: ' + g.teams[t].players.reduce((a, p) => a + p.fouls, 0), t === 0 ? 14 : w - 14, 22);
      }
      // Hinweis & Nachricht
      c.textAlign = 'center';
      if (g.message.t > 0) {
        const m = g.message.text; c.font = '700 20px system-ui'; const tw = c.measureText(m).width + 36;
        c.fillStyle = 'rgba(8,16,32,0.9)'; this.rr(c, w / 2 - tw / 2, this.ch - 64, tw, 38, 10); c.fill(); c.fillStyle = '#fff'; c.fillText(m, w / 2, this.ch - 45);
      }
      if (g.phase === 'restart' && g.rs) {
        const tx = { free: 'Freiwurf', corner: 'Eckball', throw: 'Torabwurf', penalty: 'Strafwurf' }[g.rs.type] || '';
        c.fillStyle = '#ffd166'; c.font = '700 14px system-ui';
        c.fillText(tx + ' ' + g.teams[g.rs.team].def.short + (g.rs.team === 0 ? ' – Pass: Rechtsklick/E · Wurf: Klick' : ''), w / 2, this.ch - 84);
        if (g.rs.type === 'penalty' && g.rs.team === 1) c.fillText('Torwart: W/S = oben/unten, Leertaste = Mitte', w / 2, this.ch - 104);
        if (g.rs.team === 0 && g.rs.type === 'free' && g.freeNoShot) { c.fillStyle = '#ff9d9d'; c.fillText('Innerhalb 6 m: nicht direkt aufs Tor – erst passen!', w / 2, this.ch - 104); }
      }
      if (g.phase === 'swim') { c.fillStyle = '#fff'; c.font = '800 26px system-ui'; c.fillText(g.pt > 0 ? 'Bereit…' : 'Sprint zum Ball!', w / 2, this.ch - 84); }
      if (g.phase === 'shootout' && g.so) {
        const so = g.so; c.font = '700 15px system-ui';
        for (let t = 0; t < 2; t++) {
          let x = w / 2 - 80, y = 100 + t * 24; c.textAlign = 'right'; c.fillStyle = '#fff'; c.fillText(g.teams[t].def.short, x - 10, y);
          c.textAlign = 'center';
          for (let i = 0; i < Math.max(5, so.log[t].length); i++) {
            c.beginPath(); c.arc(x + i * 22, y, 8, 0, 6.3);
            c.fillStyle = i < so.log[t].length ? (so.log[t][i] ? '#4cd964' : '#ff5d5d') : 'rgba(255,255,255,0.2)'; c.fill();
          }
        }
        c.fillStyle = '#ffd166'; c.textAlign = 'center';
        if (so.state === 'aim') c.fillText(so.turn === 0 ? 'Du schießt: Maus zielen, Klick halten = höher, loslassen = Wurf' : 'Gegner schießt – Torwart: W/S = oben/unten, Leertaste = Mitte', w / 2, this.ch - 84);
      }
    }
    rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }
  WP.Renderer = Renderer;
})();

</script>
<script>
// Menü, Eingabe, Hauptschleife
(function () {
  const WP = globalThis.WP, C = WP.C;
  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), R = new WP.Renderer(cv);
  let game = null, paused = false, running = false, last = 0, acc = 0;
  const keys = {};

  // ---------- Menü ----------
  const fill = (el, items, fn, sel) => { el.innerHTML = ''; items.forEach((it, i) => { const o = document.createElement('option'); o.value = fn.v(it, i); o.textContent = fn.t(it); el.appendChild(o); }); if (sel !== undefined) el.value = sel; };
  fill($('selHome'), WP.TEAMS, { v: (t, i) => i, t: t => t.name }, 0);
  fill($('selAway'), WP.TEAMS, { v: (t, i) => i, t: t => t.name }, 1);
  fill($('selCap'), WP.CAPS.slice(0, 6), { v: c => c.id, t: c => c.name }, 'white');
  fill($('selStyle'), WP.CAP_STYLES, { v: s => s.id, t: s => s.name }, 'classic');
  fill($('selDiff'), Object.keys(WP.DIFFICULTY), { v: k => k, t: k => WP.DIFFICULTY[k].name }, 'normal');
  fill($('selLen'), WP.QUARTER_REAL, { v: q => q.id, t: q => q.name }, 180);

  function capEl(hex, ink, style, num, label) {
    const d = document.createElement('div'); d.className = 'pv';
    const c = document.createElement('div'); c.className = 'cap'; c.style.background = hex; c.style.color = ink; c.textContent = num;
    if (style === 'stripe') c.style.background = 'linear-gradient(90deg,' + hex + ' 40%,#1f46c8 40%,#1f46c8 60%,' + hex + ' 60%)';
    if (style === 'panels') c.style.background = 'linear-gradient(90deg,' + hex + ' 50%,#9db8f2 50%)';
    if (style !== 'classic' && num !== 1) c.style.color = '#101830';
    d.appendChild(c); d.appendChild(document.createTextNode(label)); return d;
  }
  function preview() {
    const p = $('preview'); p.innerHTML = '';
    const cap = WP.CAPS.find(c => c.id === $('selCap').value), st = $('selStyle').value;
    p.appendChild(capEl(cap.hex, cap.ink, st, 7, 'Feldspieler'));
    p.appendChild(capEl(WP.GK_CAP.hex, WP.GK_CAP.ink, 'classic', 1, 'Torwart'));
    const blue = cap.id === 'blue' || cap.id === 'navy' ? WP.CAPS[0] : WP.CAPS[1];
    p.appendChild(capEl(blue.hex, blue.ink, 'classic', 5, 'Gegner'));
  }
  ['selCap', 'selStyle'].forEach(i => $(i).addEventListener('change', preview)); preview();

  function info(title, rows) {
    $('infoTitle').textContent = title;
    $('infoBody').innerHTML = '<table>' + rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') + '</table>';
    $('info').classList.remove('hidden');
  }
  $('btnRules').onclick = () => info('Wasserball-Regeln im Spiel', WP.RULES_TEXT);
  $('btnControls').onclick = () => info('Steuerung', WP.CONTROLS_TEXT);
  $('btnInfoClose').onclick = () => $('info').classList.add('hidden');

  function start() {
    let h = +$('selHome').value, a = +$('selAway').value;
    if (h === a) a = (h + 1) % WP.TEAMS.length;
    WP.Audio.init(); WP.Audio.resume();
    game = new WP.Game({ home: h, away: a, cap: $('selCap').value, style: $('selStyle').value, diff: $('selDiff').value, quarterReal: +$('selLen').value });
    ['menu', 'result', 'pause'].forEach(i => $(i).classList.add('hidden'));
    paused = false; running = true; last = performance.now(); R.resize();
  }
  $('btnStart').onclick = start; $('btnAgain').onclick = start;
  const toMenu = () => { running = false; game = null; ['pause', 'result'].forEach(i => $(i).classList.add('hidden')); $('menu').classList.remove('hidden'); };
  $('btnMenu').onclick = toMenu; $('btnQuit').onclick = toMenu;
  $('btnResume').onclick = () => setPause(false);
  $('btnSound').onclick = () => { WP.Audio.setEnabled(!WP.Audio.isEnabled()); $('btnSound').textContent = WP.Audio.isEnabled() ? '🔊 Ton an' : '🔇 Ton aus'; };
  function setPause(v) { if (!game || game.finished) return; paused = v; $('pause').classList.toggle('hidden', !v); last = performance.now(); }

  // ---------- Eingabe ----------
  const I = () => game && game.input;
  function updMove() {
    const i = I(); if (!i) return;
    i.mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    i.my = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
    i.sprint = !!(keys.ShiftLeft || keys.ShiftRight);
  }
  addEventListener('keydown', (e) => {
    if (!game) return;
    if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.repeat) { keys[e.code] = true; updMove(); return; }
    keys[e.code] = true; const i = I();
    if (e.code === 'Escape' || e.code === 'KeyP') return setPause(!paused);
    if (e.code === 'Space') { i.tackle = true; game.diveSel = 0; }
    if (e.code === 'KeyE') i.pass = true;
    if (e.code === 'KeyF') i.fake = true;
    if (e.code === 'KeyQ' || e.code === 'Tab') i.switchP = true;
    if (e.code === 'KeyX') i.sub = true;
    if (e.code === 'KeyT') i.timeout = true;
    if (e.code === 'KeyW' || e.code === 'ArrowUp') game.diveSel = -1;
    if (e.code === 'KeyS' || e.code === 'ArrowDown') game.diveSel = 1;
    updMove();
  });
  addEventListener('keyup', (e) => { keys[e.code] = false; updMove(); });
  cv.addEventListener('mousemove', (e) => {
    if (!game) return; const r = cv.getBoundingClientRect(), w = R.toWorld(e.clientX - r.left, e.clientY - r.top);
    game.input.aimX = w.x; game.input.aimY = w.y;
  });
  cv.addEventListener('mousedown', (e) => {
    if (!game || paused) return; WP.Audio.resume();
    if (e.button === 0) game.input.shootHeld = true;
    if (e.button === 2) game.input.pass = true;
  });
  addEventListener('mouseup', (e) => { if (game && e.button === 0 && game.input.shootHeld) { game.input.shootHeld = false; game.input.shootRelease = true; } });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  addEventListener('resize', () => R.resize());
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (game) updMove(); setPause(true); });

  // ---------- Schleife ----------
  function showResult() {
    const g = game, a = g.teams[0], b = g.teams[1];
    $('resTitle').textContent = g.winner === 0 ? '🏆 Sieg für ' + a.def.name + '!' : g.winner === 1 ? 'Niederlage gegen ' + b.def.name : 'Unentschieden';
    $('resScore').textContent = a.score + ' : ' + b.score + (g.so ? '  (' + g.so.goals[0] + ':' + g.so.goals[1] + ' n.E.)' : '');
    const rows = [['Schüsse', a.stats.shots, b.stats.shots], ['Paraden', a.stats.saves, b.stats.saves], ['Fouls', a.stats.fouls, b.stats.fouls],
      ['Hinausstellungen', a.stats.excl, b.stats.excl], ['Strafwürfe', a.stats.pens, b.stats.pens], ['Ballbesitz (s)', Math.round(a.stats.poss), Math.round(b.stats.poss)]];
    const scorers = (T) => T.players.filter(p => p.goals).map(p => '#' + p.num + ' ' + p.name + ' ' + p.goals).join(', ') || '–';
    rows.push(['Torschützen', scorers(a), scorers(b)]);
    $('resStats').innerHTML = '<div class="stat"><b>' + a.def.short + '</b><span></span><b>' + b.def.short + '</b></div>' + rows.map(r => '<div class="stat"><span>' + r[1] + '</span><span style="color:#9fb4d3">' + r[0] + '</span><span>' + r[2] + '</span></div>').join('');
    $('result').classList.remove('hidden');
  }
  function loop(now) {
    requestAnimationFrame(loop);
    if (!game) { R.draw(WP.idle || (WP.idle = new WP.Game({ home: 0, away: 1, auto: true, quarterReal: 90 })), 0.016, null); WP.idle.update(0.016); return; }
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (running && !paused && !game.finished) { acc += dt; let n = 0; while (acc >= 1 / 60 && n++ < 4) { game.update(1 / 60); acc -= 1 / 60; } if (game.finished && $('result').classList.contains('hidden')) setTimeout(showResult, 1200); }
    R.draw(game, paused ? 0 : dt, { aim: true });
  }
  requestAnimationFrame(loop);
  WP.debug = { get game() { return game; } };
})();

</script>
